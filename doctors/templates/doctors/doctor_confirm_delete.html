<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <title>{{ title }}</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background: #101827;
            color: white;
            padding: 50px 20px;
            text-align: center;
        }
        .confirm-box {
            max-width: 550px;
            margin: auto;
            background: #1e293b;
            padding: 35px;
            border-radius: 15px;
        }
        h1 { color: #f5c542; }
        .doctor-name { color: #13c8d4; font-size: 22px; }
        button, a {
            display: inline-block;
            margin: 20px 8px 0;
            padding: 12px 24px;
            border-radius: 8px;
            text-decoration: none;
            cursor: pointer;
            font-size: 16px;
        }
        button {
            background: #dc3545;
            color: white;
            border: none;
        }
        a { background: #64748b; color: white; }
    </style>
</head>
<body>
    <div class="confirm-box">
        <h1>تأكيد حذف الطبيب</h1>
        <p>هل أنت متأكد من حذف ملف الطبيب التالي؟</p>
        <p class="doctor-name">{{ doctor.name }}</p>

        <form method="post">
            {% csrf_token %}
            <button type="submit">نعم، احذف الطبيب</button>
            <a href="{% url 'doctors:home' %}">إلغاء والعودة</a>
        </form>
    </div>
</body>
</html>
