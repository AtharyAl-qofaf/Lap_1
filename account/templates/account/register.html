<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>إنشاء حساب جديد | Care Medical</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body { background-color: #0f172a; color: #f8fafc; display: flex; justify-content: center; align-items: center; min-height: 100vh; padding: 20px; }
        .card { background: #1e293b; padding: 35px 30px; border-radius: 16px; box-shadow: 0 10px 25px rgba(0,0,0,0.4); width: 100%; max-width: 420px; border: 1px solid #334155; }
        .header { text-align: center; margin-bottom: 25px; }
        .header h2 { color: #38bdf8; font-size: 24px; margin-bottom: 8px; }
        .header p { color: #94a3b8; font-size: 14px; }
        .form-group { margin-bottom: 15px; text-align: right; }
        .form-group label { display: block; margin-bottom: 6px; color: #cbd5e1; font-size: 14px; }
        input[type="text"], input[type="password"] { width: 100%; padding: 12px; background: #0f172a; border: 1px solid #475569; border-radius: 8px; color: #ffffff; font-size: 14px; outline: none; transition: 0.3s; }
        input[type="text"]:focus, input[type="password"]:focus { border-color: #38bdf8; box-shadow: 0 0 8px rgba(56, 189, 248, 0.3); }
        .helptext { display: block; color: #64748b; font-size: 11px; margin-top: 4px; line-height: 1.4; }
        ul.errorlist { color: #f87171; font-size: 12px; list-style: none; margin-top: 5px; }
        .btn-submit { width: 100%; padding: 12px; background: linear-gradient(135deg, #0ea5e9, #0284c7); color: white; border: none; border-radius: 8px; font-size: 16px; font-weight: bold; cursor: pointer; transition: 0.3s; margin-top: 15px; }
        .btn-submit:hover { opacity: 0.9; transform: translateY(-1px); }
        .footer-text { text-align: center; margin-top: 20px; color: #94a3b8; font-size: 14px; }
        .footer-text a { color: #38bdf8; text-decoration: none; font-weight: bold; }
        .footer-text a:hover { text-decoration: underline; }
    </style>
</head>
<body>
    <div class="card">
        <div class="header">
            <h2>إنشاء حساب جديد 👤</h2>
            <p>أدخل البيانات المطلوبة للانضمام إلى المنظومة الطبية</p>
        </div>
       
        <form method="POST">
            {% csrf_token %}
           
            {% for field in form %}
                <div class="form-group">
                    <label for="{{ field.id_for_label }}">{{ field.label }}</label>
                    {{ field }}
                    {% if field.help_text %}
                        <span class="helptext">{{ field.help_text }}</span>
                    {% endif %}
                    {% for error in field.errors %}
                        <ul class="errorlist"><li>{{ error }}</li></ul>
                    {% endfor %}
                </div>
            {% endfor %}

            <button type="submit" class="btn-submit">تسجيل الحساب</button>
        </form>

        <div class="footer-text">
            لديك حساب بالفعل؟ <a href="{% url 'login' %}">تسجيل الدخول</a>
        </div>
    </div>
</body>
</html>
